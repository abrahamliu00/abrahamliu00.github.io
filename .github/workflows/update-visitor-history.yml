name: Update visitor history

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Query Statable
        env:
          STATABLE_API_KEY: ${{ secrets.STATABLE_API_KEY }}
        run: |
          if [ -z "$STATABLE_API_KEY" ]; then
            echo "STATABLE_API_KEY is not configured; keeping the current 90-day display."
            exit 0
          fi
          node .github/scripts/update-visitor-history.mjs
      - name: Publish updated data
        id: publish
        run: |
          if git diff --quiet -- visitor-history.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visitor-history.json
          git commit -m "Update visitor history"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Request Pages build
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds"
